name: Compile Allwinner A63 U-Boot

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    - name: Install Compiler Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-aarch64-linux-gnu bison flex libssl-dev device-tree-compiler git make

    - name: Fetch and Compile ARM Trusted Firmware
      run: |
        git clone --depth 1 https://github.com
        cd arm-trusted-firmware
        make CROSS_COMPILE=aarch64-linux-gnu- PLAT=sun50i_h6 bl31
        echo "BL31_BIN_PATH=$(pwd)/build/sun50i_h6/release/bl31.bin" >> $GITHUB_ENV

    - name: Fetch and Compile Mainline U-Boot
      run: |
        git clone --depth 1 https://denx.de
        cd u-boot
        export BL31=${{ env.BL31_BIN_PATH }}
        make CROSS_COMPILE=aarch64-linux-gnu- pine_h64_defconfig
        make CROSS_COMPILE=aarch64-linux-gnu- -j$(nproc)
        mkdir -p ../output
        cp u-boot-sunxi-with-spl.bin ../output/

    - name: Package and Upload Completed Binaries
      uses: actions/upload-artifact@v4
      with:
        name: allwinner-a63-compiled-uboot
        path: output/u-boot-sunxi-with-spl.bin
